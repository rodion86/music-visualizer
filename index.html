<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BURATINO CLIENT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ac:#fff;--bg:#000}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Space Grotesk','Segoe UI',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow:hidden;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;filter:blur(100px);animation:orbFloat 20s ease-in-out infinite;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 7%,transparent),transparent)}
.bg-orb:nth-child(1){width:700px;height:700px;top:-20%;left:5%;animation-delay:0s}
.bg-orb:nth-child(2){width:500px;height:500px;bottom:-15%;right:0%;animation-delay:-7s}
.bg-orb:nth-child(3){width:450px;height:450px;top:40%;left:55%;animation-delay:-14s}
.bg-orb:nth-child(4){width:350px;height:350px;top:70%;left:20%;animation-delay:-3s}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1) rotate(0deg)}25%{transform:translate(60px,-40px) scale(1.15) rotate(90deg)}50%{transform:translate(-20px,60px) scale(.85) rotate(180deg)}75%{transform:translate(-50px,-20px) scale(1.1) rotate(270deg)}100%{transform:translate(0,0) scale(1) rotate(360deg)}}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--ac) 4%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 4%,transparent) 1px,transparent 1px);background-size:80px 80px}
.bg-grid::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--ac) 6%,transparent),transparent 70%)}
.bg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.35) 80%,transparent 100%)}
.bg-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 15%,transparent),transparent);animation:lineScan 8s ease-in-out infinite}
.bg-line:nth-child(6){top:30%;left:0;right:0;animation-delay:0s}
.bg-line:nth-child(7){top:60%;left:0;right:0;animation-delay:-4s}
@keyframes lineScan{0%{opacity:0;transform:translateX(-100%)}50%{opacity:1}100%{opacity:0;transform:translateX(100%)}}
.hero{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 20px}
.hero-big{font-family:'Space Grotesk','Segoe UI',sans-serif;font-size:clamp(3.5rem,14vw,10rem);font-weight:700;letter-spacing:-4px;line-height:1;color:var(--ac);text-shadow:0 0 80px color-mix(in srgb,var(--ac) 18%,transparent),0 0 200px color-mix(in srgb,var(--ac) 10%,transparent);opacity:0;animation:fadeUp .8s ease forwards}
.hero-sub{font-family:'JetBrains Mono','Space Grotesk',monospace;font-size:clamp(.85rem,2.4vw,1.3rem);letter-spacing:8px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:22px;opacity:0;animation:fadeUp .8s ease forwards;animation-delay:.2s}
.hero-btns{display:flex;gap:14px;justify-content:center;margin-top:36px;opacity:0;animation:fadeUp .8s ease forwards;animation-delay:.35s}
.hero-btn{font-family:'Space Grotesk','Segoe UI',sans-serif;padding:14px 34px;border-radius:10px;font-size:.95rem;font-weight:700;letter-spacing:.3px;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;pointer-events:auto;transition:all .3s cubic-bezier(.4,0,.2,1)}
.hero-btn span{position:relative;z-index:1}
.hero-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.08);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.hero-btn:hover::before{transform:scaleX(1)}
.hero-btn.primary{background:var(--ac);color:#000;border:1px solid var(--ac)}
.hero-btn.primary:hover{transform:translateY(-3px);box-shadow:0 14px 40px color-mix(in srgb,var(--ac) 22%,transparent)}
.hero-btn.primary::before{display:none}
.hero-btn.ghost{border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.65);background:transparent}
.hero-btn.ghost:hover{color:#fff;border-color:rgba(255,255,255,.35);transform:translateY(-3px)}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modal.show{display:flex}
.modal-card{max-width:360px;width:100%;background:linear-gradient(160deg,rgba(22,22,22,.96),rgba(8,8,8,.98));border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:32px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px color-mix(in srgb,var(--ac) 6%,transparent);animation:modalIn .35s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{0%{opacity:0;transform:scale(.92) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.modal-icon{font-size:2.4rem;margin-bottom:14px}
.modal-title{font-family:'Space Grotesk','Segoe UI',sans-serif;font-size:1.05rem;font-weight:700;color:#fff;line-height:1.4;margin-bottom:8px}
.modal-text{font-size:.85rem;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:26px}
.modal-btns{display:flex;gap:12px;justify-content:center}
.modal-btns .hero-btn{flex:1;padding:12px 10px;font-size:.9rem;text-align:center;background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.65)}
.modal-btns .hero-btn.primary{background:var(--ac);color:#000;border-color:var(--ac)}
.modal-btns .hero-btn.primary::before{display:none}
.modal-btns .hero-btn:hover{transform:translateY(-2px);color:#fff;border-color:rgba(255,255,255,.4)}
.modal-btns .hero-btn.primary:hover{box-shadow:0 12px 30px color-mix(in srgb,var(--ac) 20%,transparent);color:#000}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="bg-line"></div>
  <div class="bg-line"></div>
</div>
<div class="hero">
  <div class="hero-big">BURATINO</div>
  <div class="hero-sub">client</div>
  <div class="hero-btns">
    <a class="hero-btn primary" id="dlBtn" href="#"><span>Скачать</span></a>
    <a class="hero-btn ghost" id="faqBtn" href="#"><span>FAQ</span></a>
  </div>
</div>
<div class="modal" id="downloadModal">
  <div class="modal-card">
    <div class="modal-icon">&#128218;</div>
    <div class="modal-title">Ознакомьтесь с информацией в FAQ</div>
    <div class="modal-text">Перед скачиванием клиента прочитайте раздел FAQ.</div>
    <div class="modal-btns">
      <a class="hero-btn ghost" id="modalFaq" href="#">К FAQ</a>
      <button class="hero-btn primary" id="modalOk" type="button">Понял</button>
    </div>
  </div>
</div>
<div class="modal" id="faqModal">
  <div class="modal-card">
    <div class="modal-icon">&#128172;</div>
    <div class="modal-title">FAQ</div>
    <div class="modal-text">Привет! Данный чит делается и выйдет уже в следующем году или раньше. Пока подпишись на мои соцсети!</div>
    <div class="modal-btns">
      <a class="hero-btn primary" href="https://t.me/macclient11" target="_blank" rel="noopener">ТГ</a>
      <button class="hero-btn ghost" id="faqOk" type="button">Понял</button>
    </div>
  </div>
</div>
<script>
document.getElementById('dlBtn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('downloadModal').classList.add('show');
});
const modal = document.getElementById('downloadModal');
document.getElementById('modalOk').addEventListener('click', () => modal.classList.remove('show'));
document.getElementById('modalFaq').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
const faqModal = document.getElementById('faqModal');
document.getElementById('faqBtn').addEventListener('click', e => {
  e.preventDefault();
  faqModal.classList.add('show');
});
document.getElementById('faqOk').addEventListener('click', () => faqModal.classList.remove('show'));
faqModal.addEventListener('click', e => { if (e.target === faqModal) faqModal.classList.remove('show'); });
</script>
</body>
</html>
