<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Music Bass</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#canvas{flex:1;display:block;touch-action:none}
.controls{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;z-index:10;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap;justify-content:center}
.controls label{font-size:12px;color:#aaa;cursor:pointer;display:flex;align-items:center;gap:6px}
.controls input[type=range]{width:80px;accent-color:#ff4081}
.controls input[type=color]{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0}
.controls button,.file-label{flex-shrink:0;-webkit-user-select:none;user-select:none}
.controls button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:22px;cursor:pointer;font-size:13px;transition:.2s;min-height:38px}
.controls button:hover{background:rgba(255,255,255,.2)}
.controls button.active{background:#ff4081;border-color:#ff4081}
.file-label{background:linear-gradient(135deg,#ff4081,#7c4dff);padding:8px 16px;border-radius:22px;cursor:pointer;font-size:13px;transition:.2s;min-height:38px;color:#fff;display:flex;align-items:center;gap:6px}
.file-label:hover{opacity:.85}
#audioFile,#videoFile{display:none}
.settings-panel{position:fixed;top:12px;right:12px;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;padding:14px;z-index:10;width:230px;border:1px solid rgba(255,255,255,.08);display:none}
.settings-panel.show{display:block}
.settings-panel h3{font-size:13px;margin-bottom:10px;color:#ff4081}
.settings-panel label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aaa;margin-bottom:10px;min-height:30px}
.settings-panel input[type=range]{width:90px;accent-color:#ff4081}
.settings-panel input[type=color]{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0}
.settings-panel button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:12px;width:100%;margin-bottom:6px}
.toggle-btn{position:fixed;top:12px;right:12px;z-index:11;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.title{position:fixed;top:12px;left:12px;font-size:14px;color:rgba(255,255,255,.4);z-index:10;pointer-events:none}
.photo-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.15);font-size:16px;pointer-events:none;z-index:5;text-align:center;display:none;white-space:nowrap}
.photo-hint span{display:block;font-size:11px;margin-top:4px}
@media (max-width:768px){
  .controls{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-left:14px;padding-right:14px}
  .controls::-webkit-scrollbar{display:none}
  .controls button{font-size:12px;padding:8px 11px}
  .file-label{font-size:12px;padding:8px 12px}
  .controls label{flex-shrink:0}
  .settings-panel{top:0;right:0;bottom:0;left:0;width:100%;height:100%;border-radius:0;overflow-y:auto;padding:56px 16px calc(20px + env(safe-area-inset-bottom));z-index:30}
  .settings-panel h3{font-size:16px;margin-bottom:14px}
  .settings-panel label{font-size:14px}
  .toggle-btn{top:12px;right:12px;width:44px;height:44px;font-size:20px;z-index:31}
  .title{font-size:12px}
  .photo-hint{font-size:14px}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="title" id="pageTitle">MUSIC BASS</div>
<div class="photo-hint" id="photoHint"><span data-t="photoHint">Перетащи сюда музыку, видео или фото</span><span data-t="photoHintSub">видео будет играть только звуком</span></div>

<button class="toggle-btn" id="toggleSettings">&#9881;</button>

<div class="settings-panel" id="settingsPanel">
<button id="closeSettings"><span data-t="closeSettings">✕ Закрыть</span></button>
<h3 data-t="settingsTitle">Настройки</h3>
<div style="display:flex;gap:8px;margin-bottom:10px">
<button id="langBtn" data-t="langBtn" style="width:auto;margin-bottom:0">EN</button>
</div>
<label><span data-t="sensitivity">Чувствительность</span> <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5"></label>
<label><span data-t="bounceForce">Сила отскока</span> <input type="range" id="bounceForce" min="0" max="50" step="1" value="20"></label>
<label><span data-t="particleCount">Количество частиц</span> <input type="range" id="particleCount" min="0" max="300" step="10" value="120"></label>
<label><span data-t="particleSpeed">Скорость частиц</span> <input type="range" id="particleSpeed" min="0.5" max="5" step="0.1" value="2"></label>
<label><span data-t="barWidth">Толщина полос</span> <input type="range" id="barWidth" min="1" max="8" step="0.5" value="3"></label>
<label><span data-t="ringRadius">Радиус кольца</span> <input type="range" id="ringRadius" min="50" max="250" step="5" value="130"></label>
<label><span data-t="fxIntensity">Интенсивность эффектов</span> <input type="range" id="fxIntensity" min="10" max="100" step="5" value="60"></label>
<label><span data-t="trailLength">Трейл (шлейф)</span> <input type="range" id="trailLength" min="0" max="40" step="1" value="10"></label>
<label><span data-t="photoSize">Фото размер</span> <input type="range" id="photoSize" min="40" max="300" step="5" size="100"></label>
<label><span data-t="photoFile">Загрузить фото</span> <input type="file" id="photoFile" accept="image/*" multiple></label>
<button id="clearPhotos"><span data-t="clearPhotos">Убрать все фото</span></button>
<hr style="border-color:rgba(255,255,255,.1);margin:6px 0">
<label><span data-t="colorBars">Цвет полос</span> <input type="color" id="colorBars" value="#ff4081"></label>
<label><span data-t="colorParticles">Цвет частиц</span> <input type="color" id="colorParticles" value="#7c4dff"></label>
<label><span data-t="colorBg">Цвет фона</span> <input type="color" id="colorBg" value="#0a0a0a"></label>
<label><span data-t="colorRings">Цвет колец</span> <input type="color" id="colorRings" value="#00e5ff"></label>
<label><span data-t="autoColor">Авто-смена цвета</span> <input type="checkbox" id="autoColor" checked></label>
</div>

<div class="controls">
<label class="file-label"><span data-t="loadAudio">▶ Музыка или видео</span><input type="file" id="audioFile" accept="audio/*,video/*"></label>
<label class="file-label" style="background:linear-gradient(135deg,#00e5ff,#7c4dff)"><span data-t="loadVideo">🎬 Видео (только звук)</span><input type="file" id="videoFile" accept="video/*"></label>
<button id="btnCapture" style="background:linear-gradient(135deg,#1db954,#0a7d34);border:none"><span data-t="captureBtn">🎧 Звук из приложений</span></button>
<button id="btnSpotify" style="background:linear-gradient(135deg,#1db954,#191414);border:none"><span data-t="spotifyBtn">🎵 Открыть Spotify</span></button>
<button id="btnYandex" style="background:linear-gradient(135deg,#ffcc00,#ff0033);border:none;color:#000"><span data-t="yandexBtn">🎵 Яндекс Музыка</span></button>
<span id="captureHintText" style="font-size:10px;color:rgba(255,255,255,.4);flex-shrink:0;width:100%;text-align:center;display:none" data-t="captureHint"></span>
<button id="btnBars" class="active" data-effect="bars"><span data-t="bars">Полосы</span></button>
<button id="btnCircle" class="active" data-effect="circle"><span data-t="circle">Кольцо</span></button>
<button id="btnParticles" class="active" data-effect="particles"><span data-t="particles">Частицы</span></button>
<button id="btnWave" class="active" data-effect="wave"><span data-t="wave">Волна</span></button>
<button id="btnRipple" class="active" data-effect="ripple"><span data-t="ripple">Риплы</span></button>
<button id="btnTunnel" class="active" data-effect="tunnel"><span data-t="tunnel">Тоннель</span></button>
<button id="btnSpiral" class="active" data-effect="spiral"><span data-t="spiral">Вихрь</span></button>
<button id="btnGrid" class="active" data-effect="grid"><span data-t="grid">Сетка</span></button>
<button id="btnStars" class="active" data-effect="stars"><span data-t="stars">Звёзды</span></button>
<button id="btnFire" class="active" data-effect="fire"><span data-t="fire">Пламя</span></button>
<button id="btnComets" class="active" data-effect="comets"><span data-t="comets">Кометы</span></button>
<button id="btnWater" class="active" data-effect="water"><span data-t="water">Вода</span></button>
<button id="btnGlass" class="active" data-effect="glass"><span data-t="glass">Стекло</span></button>
<button id="btnGlassStyle" style="border:1px solid #9be7ff;background:rgba(255,255,255,.06)"><span data-t="glassStyle">🪟 Стекло-стиль</span></button>
<button id="btnLiquid" class="active" data-effect="liquid"><span data-t="liquid">💧 Жидкое стекло</span></button>
<button id="btnBubbles" class="active" data-effect="bubbles"><span data-t="bubbles">Пузыри</span></button>
<button id="btnMosaic" class="active" data-effect="mosaic"><span data-t="mosaic">Мозаика</span></button>
<button id="btnPhoto" class="active" data-effect="photo"><span data-t="photo">Фото</span></button>
<label><span data-t="volume">Громкость</span> <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7"></label>
</div>

<script>
const LANGS = {
  ru: {
    photoHint: 'Перетащи сюда музыку, видео или фото',
    photoHintSub: 'видео будет играть только звуком',
    closeSettings: '✕ Закрыть',
    settingsTitle: 'Настройки',
    sensitivity: 'Чувствительность',
    bounceForce: 'Сила отскока',
    particleCount: 'Количество частиц',
    particleSpeed: 'Скорость частиц',
    barWidth: 'Толщина полос',
    ringRadius: 'Радиус кольца',
    fxIntensity: 'Интенсивность эффектов',
    trailLength: 'Трейл (шлейф)',
    photoSize: 'Фото размер',
    photoFile: 'Загрузить фото',
    clearPhotos: 'Убрать все фото',
    colorBars: 'Цвет полос',
    colorParticles: 'Цвет частиц',
    colorBg: 'Цвет фона',
    colorRings: 'Цвет колец',
    autoColor: 'Авто-смена цвета',
    loadAudio: '▶ Музыка или видео',
    loadVideo: '🎬 Видео (только звук)',
    captureBtn: '🎧 Звук из приложений',
    captureStop: '⏹ Остановить звук',
    spotifyBtn: '🎵 Открыть Spotify',
    yandexBtn: '🎵 Яндекс Музыка',
    captureHint: 'Открой плеер → нажми 🎧 захват → выбери вкладку с галочкой «Аудио»',
    bars: 'Полосы',
    circle: 'Кольцо',
    particles: 'Частицы',
    wave: 'Волна',
    ripple: 'Риплы',
    tunnel: 'Тоннель',
    spiral: 'Вихрь',
    grid: 'Сетка',
    stars: 'Звёзды',
    fire: 'Пламя',
    comets: 'Кометы',
    water: 'Вода',
    glass: 'Стекло',
    glassStyle: '🪟 Стекло-стиль',
    liquid: '💧 Жидкое стекло',
    bubbles: 'Пузыри',
    mosaic: 'Мозаика',
    photo: 'Фото',
    volume: 'Громкость',
    langBtn: 'EN',
    captureError: 'Не удалось захватить звук. В окне выбора обязательно включи галочку «Поделиться аудио».'
  },
  en: {
    photoHint: 'Drop music, video or photos here',
    photoHintSub: 'video plays audio only',
    closeSettings: '✕ Close',
    settingsTitle: 'Settings',
    sensitivity: 'Sensitivity',
    bounceForce: 'Bounce force',
    particleCount: 'Particle count',
    particleSpeed: 'Particle speed',
    barWidth: 'Bar width',
    ringRadius: 'Ring radius',
    fxIntensity: 'Effects intensity',
    trailLength: 'Trail',
    photoSize: 'Photo size',
    photoFile: 'Upload photo',
    clearPhotos: 'Clear all photos',
    colorBars: 'Bar color',
    colorParticles: 'Particle color',
    colorBg: 'Background color',
    colorRings: 'Ring color',
    autoColor: 'Auto color cycle',
    loadAudio: '▶ Music or video',
    loadVideo: '🎬 Video (audio only)',
    captureBtn: '🎧 Capture app sound',
    captureStop: '⏹ Stop sound',
    spotifyBtn: '🎵 Open Spotify',
    yandexBtn: '🎵 Yandex Music',
    captureHint: 'Open the player → press 🎧 capture → pick the tab with "Audio" checked',
    bars: 'Bars',
    circle: 'Circle',
    particles: 'Particles',
    wave: 'Wave',
    ripple: 'Ripples',
    tunnel: 'Tunnel',
    spiral: 'Spiral',
    grid: 'Grid',
    stars: 'Stars',
    fire: 'Fire',
    comets: 'Comets',
    water: 'Water',
    glass: 'Glass',
    glassStyle: '🪟 Glass style',
    liquid: '💧 Liquid glass',
    bubbles: 'Bubbles',
    mosaic: 'Mosaic',
    photo: 'Photo',
    volume: 'Volume',
    langBtn: 'RU',
    captureError: 'Failed to capture sound. In the picker, make sure to enable "Share audio".'
  }
};

let currentLang = localStorage.getItem('mb_lang') || 'ru';
function t(key) { return (LANGS[currentLang] || LANGS.ru)[key] || key; }

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('mb_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    el.textContent = t(el.getAttribute('data-t'));
  });
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let audioCtx, analyser, dataArray, bufferLength, source;
let audio = new Audio();
let isPlaying = false;
let beatThreshold = 0.6;
let lastBeat = 0;
let beatIntensity = 0;
let hueOffset = 0;
let GLASS_STYLE = (localStorage.getItem('mb_glass') === null) ? true : (localStorage.getItem('mb_glass') === '1');

const effects = { bars: true, circle: true, particles: true, wave: true, ripple: true, tunnel: true, spiral: true, grid: true, stars: true, fire: true, comets: true, mosaic: true, photo: true, water: true, glass: true, bubbles: true, liquid: true }; 

const particles = [];
const ripples = [];
const fireParticles = [];
const comets = [];
const stars = [];
const bubbles = [];
const shards = [];

function fx() {
  return (parseInt(document.getElementById('fxIntensity').value) / 60) * (IS_MOBILE ? 0.65 : 1);
}

function gColor(hue, alpha) {
  return hslToStr((hueOffset + hue) % 360, 20, 90, alpha);
}

const photos = [];
let photoDragIndex = null;

function loadAudioFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  audio.src = url;
  audio.load();
  if (!audioCtx) initAudio();
  audio.play();
  isPlaying = true;
  audio.addEventListener('ended', () => { isPlaying = false; });
}

document.getElementById('audioFile').addEventListener('change', e => {
  loadAudioFile(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('videoFile').addEventListener('change', e => {
  loadAudioFile(e.target.files[0]);
  e.target.value = '';
});

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  bindFileSource();
  analyser.connect(audioCtx.destination);
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
}

function bindFileSource() {
  if (!source) {
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
  }
}

let captureStream = null;
let captureSource = null;
let captureOn = false;

function setCaptureLabel(key) {
  const span = document.querySelector('#btnCapture span');
  if (span) span.textContent = t(key);
}

document.getElementById('btnCapture').addEventListener('click', async () => {
  document.getElementById('captureHintText').style.display = 'block';
  if (captureOn) {
    captureStream.getTracks().forEach(t => t.stop());
    captureOn = false;
    if (captureSource) {
      captureSource.disconnect();
      captureSource = null;
    }
    setCaptureLabel('captureBtn');
    isPlaying = false;
    return;
  }
  try {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.pause();

    captureStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const vTrack = captureStream.getVideoTracks()[0];
    if (vTrack) vTrack.stop();

    captureSource = audioCtx.createMediaStreamSource(captureStream);
    captureSource.connect(analyser);
    captureOn = true;
    isPlaying = true;
    setCaptureLabel('captureStop');

    captureStream.oninactive = () => {
      captureOn = false;
      if (captureSource) captureSource.disconnect();
      setCaptureLabel('captureBtn');
      isPlaying = false;
    };
  } catch (err) {
    alert(t('captureError'));
    console.error(err);
  }
});

document.getElementById('btnSpotify').addEventListener('click', () => {
  window.open('https://open.spotify.com', '_blank');
  document.getElementById('captureHintText').style.display = 'block';
});

document.getElementById('btnYandex').addEventListener('click', () => {
  window.open('https://music.yandex.ru/playlists/lk.e3093821-7202-42c6-8c4e-ab971f47177b?utm_source=desktop&utm_medium=copy_link', '_blank');
  document.getElementById('captureHintText').style.display = 'block';
});

applyLang(currentLang);

document.getElementById('toggleSettings').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.toggle('show');
});
document.getElementById('closeSettings').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('show');
});
document.getElementById('langBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('show');
  applyLang(currentLang === 'ru' ? 'en' : 'ru');
});

document.querySelectorAll('[data-effect]').forEach(btn => {
  btn.addEventListener('click', () => {
    const e = btn.dataset.effect;
    effects[e] = !effects[e];
    btn.classList.toggle('active');
  });
});

document.getElementById('btnGlassStyle').addEventListener('click', () => {
  GLASS_STYLE = !GLASS_STYLE;
  localStorage.setItem('mb_glass', GLASS_STYLE ? '1' : '0');
  document.getElementById('btnGlassStyle').classList.toggle('active', GLASS_STYLE);
});
document.getElementById('btnGlassStyle').classList.toggle('active', GLASS_STYLE);

document.getElementById('volume').addEventListener('input', e => {
  audio.volume = e.target.value;
});

function addPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => {
    photos.push({
      img,
      orbitAngle: Math.random() * Math.PI * 2,
      orbitSpeed: 0.0002 + Math.random() * 0.0006,
      orbitRadius: 40 + Math.random() * 80,
      sizeMult: 0.5 + Math.random() * 0.7,
      phaseX: Math.random() * 100,
      phaseY: Math.random() * 100
    });
  };
  img.src = URL.createObjectURL(file);
  document.getElementById('photoHint').style.display = 'none';
}

document.getElementById('photoFile').addEventListener('change', e => {
  for (const file of e.target.files) addPhoto(file);
  e.target.value = '';
});

document.getElementById('clearPhotos').addEventListener('click', () => {
  photos.length = 0;
});

document.getElementById('photoSize').value = 100;

canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  let droppedImage = false;
  for (const file of e.dataTransfer.files) {
    if (file.type.startsWith('image/')) {
      addPhoto(file);
      droppedImage = true;
    } else if (file.type.startsWith('audio/') || file.type.startsWith('video/')) {
      loadAudioFile(file);
    }
  }
  if (!droppedImage && e.dataTransfer.files.length === 0) {
    document.getElementById('photoHint').style.display = 'none';
  }
});

function getVal(i) {
  if (!dataArray) return 0;
  return (dataArray[i] / 255) * parseFloat(document.getElementById('sensitivity').value);
}

function getAvg(start, end) {
  if (!dataArray) return 0;
  let sum = 0;
  const s = Math.floor(start * bufferLength);
  const e2 = Math.floor(end * bufferLength);
  for (let i = s; i < e2; i++) sum += dataArray[i];
  return (sum / ((e2 - s) * 255)) * parseFloat(document.getElementById('sensitivity').value);
}

function detectBeat() {
  const bass = getAvg(0, 0.1);
  const now = performance.now();
  if (bass > beatThreshold && now - lastBeat > 150) {
    lastBeat = now;
    beatIntensity = Math.min(bass * 1.5, 1);
    return true;
  }
  beatIntensity *= 0.92;
  return false;
}

function hslToStr(h, s, l, a) {
  return `hsla(${h % 360},${s}%,${l}%,${a !== undefined ? a : 1})`;
}

function spawnParticles(count) {
  const speed = parseFloat(document.getElementById('particleSpeed').value);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = (0.5 + Math.random() * 2) * speed;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.005 + Math.random() * 0.015,
      size: 1 + Math.random() * 3,
      hue: (hueOffset + Math.random() * 60) % 360
    });
  }
}

function drawBars() {
  const autoColor = document.getElementById('autoColor').checked;
  const baseColor = document.getElementById('colorBars').value;
  const bw = parseFloat(document.getElementById('barWidth').value);
  const count = Math.floor(bufferLength * 0.6);

  for (let i = 0; i < count; i++) {
    const val = getVal(i);
    const h = val * H * 0.4;
    const x = (i / count) * W;
    let color;
    if (autoColor) {
      color = hslToStr((hueOffset + (i / count) * 120) % 360, 80, 55 + val * 20, 0.8 + val * 0.2);
    } else {
      color = baseColor;
    }
    ctx.fillStyle = color;
    ctx.fillRect(x, H - h, bw, h);
    ctx.fillStyle = hslToStr((hueOffset + (i / count) * 120) % 360, 80, 55, 0.3);
    ctx.fillRect(x, 0, bw, h * 0.3);
  }
}

function drawCircle() {
  const autoColor = document.getElementById('autoColor').checked;
  const baseColor = document.getElementById('colorRings').value;
  const radius = parseFloat(document.getElementById('ringRadius').value) + beatIntensity * 30;
  const count = Math.floor(bufferLength * 0.5);

  ctx.save();
  ctx.translate(cx, cy);

  for (let i = 0; i < count; i++) {
    const val = getVal(i);
    const angle = (i / count) * Math.PI * 2;
    const len = val * 80 + 5;
    const x1 = Math.cos(angle) * radius;
    const y1 = Math.sin(angle) * radius;
    const x2 = Math.cos(angle) * (radius + len);
    const y2 = Math.sin(angle) * (radius + len);

    let color;
    if (autoColor) {
      color = hslToStr((hueOffset + (i / count) * 360) % 360, 85, 55 + val * 15);
    } else {
      color = baseColor;
    }

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (beatIntensity > 0.1) {
    ctx.beginPath();
    ctx.arc(0, 0, radius - 5, 0, Math.PI * 2);
    ctx.strokeStyle = hslToStr(hueOffset % 360, 80, 60, beatIntensity * 0.5);
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawWave() {
  if (!dataArray) return;
  const autoColor = document.getElementById('autoColor').checked;
  const baseColor = document.getElementById('colorBars').value;

  ctx.beginPath();
  analyser.getByteTimeDomainData(dataArray);

  for (let i = 0; i < bufferLength; i++) {
    const x = (i / bufferLength) * W;
    const v = dataArray[i] / 128.0;
    const y = cy + (v - 1) * H * 0.25 * parseFloat(document.getElementById('sensitivity').value);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  let color;
  if (autoColor) {
    color = hslToStr((hueOffset + 180) % 360, 90, 60, 0.7);
  } else {
    color = baseColor;
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function updateParticles() {
  const max = parseInt(document.getElementById('particleCount').value);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.life -= p.decay;
    if (p.life <= 0 || particles.length > max + 50) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (GLASS_STYLE) {
      const s = p.size * (0.8 + beatIntensity);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.hue * 0.1 + performance.now() / 900);
      ctx.globalAlpha = p.life * 0.75;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.9, s * 0.65);
      ctx.lineTo(-s * 0.7, s * 0.8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(220,240,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s * 0.05, -s * 0.25, s * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + beatIntensity), 0, Math.PI * 2);
      ctx.fillStyle = hslToStr(p.hue, 80, 60, p.life * 0.8);
      ctx.fill();
    }
  }
}

function drawTunnel() {
  const bass = getAvg(0, 0.1);
  const mid = getAvg(0.15, 0.4);
  const pulse = bass * 60 * fx() + 20;
  const rings = 24;
  const wobble = Math.sin(performance.now() / 800) * 15;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineWidth = 2;

  for (let i = rings; i >= 1; i--) {
    const t = (i / rings);
    const r = (0.35 + t) * (H * 0.5) + pulse * (1 - t) + wobble * t;
    const alpha = 0.08 + t * 0.5 + beatIntensity * 0.3;
    const autoColor = document.getElementById('autoColor').checked;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(r, 2), 0, Math.PI * 2);
    if (autoColor) {
      ctx.strokeStyle = hslToStr((hueOffset + t * 180 + mid * 40) % 360, 80, 55 + mid * 30, alpha * 0.8);
    } else {
      ctx.strokeStyle = document.getElementById('colorRings').value;
      ctx.globalAlpha = alpha * 0.8;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawSpiral() {
  const mid = getAvg(0.05, 0.5);
  const turns = 3 + mid * 3 * fx();
  const dots = Math.floor(160 * fx()) + 80;
  const t = performance.now() / 900;

  ctx.save();
  ctx.translate(cx, cy);

  for (let i = 0; i < dots; i++) {
    const p = i / dots;
    const ang = p * Math.PI * 2 * turns + t * (1 + mid);
    const rad = Math.max(p * H * 0.45 * (1.2 - mid * 0.5), 2);
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    const s = (2 + mid * 6 * fx()) * (1 + beatIntensity * 0.5);
    const autoColor = document.getElementById('autoColor').checked;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    if (autoColor) {
      ctx.fillStyle = hslToStr((hueOffset + p * 360) % 360, 85, 60, 0.4 + p * 0.5);
    } else {
      ctx.fillStyle = document.getElementById('colorParticles').value;
      ctx.globalAlpha = 0.4 + p * 0.5;
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGrid() {
  const cols = 16;
  const rows = Math.floor(cols * (H / W));
  const cw = W / cols;
  const ch = H / rows;
  const amp = H * 0.12 * fx();
  const autoColor = document.getElementById('autoColor').checked;

  ctx.lineWidth = 1;
  for (let x = 0; x <= cols; x++) {
    const px = x * cw;
    const bend = Math.sin(x * 0.4 + performance.now() / 600) * amp * getAvg(0.2, 0.5);
    ctx.beginPath();
    ctx.moveTo(px, 0);
    for (let y = 0; y <= rows; y++) {
      const py = y * ch;
      const off = Math.sin(py * 0.02 + performance.now() / 700 + x) * bend;
      ctx.lineTo(px + off, py);
    }
    if (autoColor) {
      ctx.strokeStyle = hslToStr((hueOffset + (x / cols) * 90) % 360, 75, 55, 0.5);
    } else {
      ctx.strokeStyle = document.getElementById('colorRings').value;
      ctx.globalAlpha = 0.5;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawStars() {
  const count = IS_MOBILE ? 60 : 120;
  const autoColor = document.getElementById('autoColor').checked;
  for (let i = 0; i < count; i++) {
    stars[i] = stars[i] || {
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random(),
      tw: Math.random() * Math.PI * 2
    };
    const st = stars[i];
    st.tw += 0.05;
    const twinkle = (Math.sin(st.tw) + 1) / 2;
    const beatGlow = beatIntensity * 0.8 * (1 - st.z);
    const size = (0.5 + twinkle * 2 + beatGlow * 3) * (0.5 + st.z);
    ctx.beginPath();
    ctx.arc(st.x, st.y, Math.max(size, 0.2), 0, Math.PI * 2);
    if (autoColor) {
      ctx.fillStyle = hslToStr((hueOffset + st.z * 80) % 360, 90, 70 + twinkle * 30, 0.3 + twinkle * 0.7);
    } else {
      ctx.fillStyle = document.getElementById('colorParticles').value;
      ctx.globalAlpha = 0.3 + twinkle * 0.7;
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function spawnFire() {
  const count = Math.floor(20 * fx()) + 6;
  for (let i = 0; i < count; i++) {
    fireParticles.push({
      x: Math.random() * W,
      y: H + Math.random() * 10,
      vy: -(1 + Math.random() * 3) * fx(),
      vx: (Math.random() - 0.5) * 2,
      size: 2 + Math.random() * 5,
      heat: 0.7 + Math.random() * 0.3
    });
  }
}

function updateFire() {
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    const f = fireParticles[i];
    f.y += f.vy;
    f.x += f.vx + (Math.random() - 0.5) * 1.5;
    f.vy *= 0.995;
    f.heat -= 0.02;
    if (f.heat <= 0 || f.y < -20) fireParticles.splice(i, 1);
  }
}

function drawFire() {
  const autoColor = document.getElementById('autoColor').checked;
  const height = getAvg(0, 0.15);
  if (Math.random() < 0.5 + height * 0.5) spawnFire();

  for (const f of fireParticles) {
    const s = f.size * (0.6 + f.heat) * (1 + beatIntensity);
    ctx.beginPath();
    ctx.arc(f.x, f.y, s, 0, Math.PI * 2);
    if (autoColor) {
      ctx.fillStyle = hslToStr(hueOffset + (1 - f.heat) * 40, 90, 55, f.heat);
    } else {
      ctx.fillStyle = `rgba(255, ${Math.floor(120 + f.heat * 90)}, 0, ${f.heat})`;
    }
    ctx.fill();
  }
}

function spawnComet() {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H);
  comets.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    angle,
    speed: (4 + Math.random() * 4) * fx(),
    tail: []
  });
}

function updateComets() {
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.x -= Math.cos(c.angle) * c.speed;
    c.y -= Math.sin(c.angle) * c.speed;
    c.tail.push({ x: c.x, y: c.y });
    if (c.tail.length > 20) c.tail.shift();
    if (Math.hypot(c.x - cx, c.y - cy) < 5) comets.splice(i, 1);
  }
}

function drawComets() {
  const autoColor = document.getElementById('autoColor').checked;
  const energy = getAvg(0, 0.3);
  if (energy > 0.35 * fx() && Math.random() < 0.25) spawnComet();

  for (const c of comets) {
    for (let j = 0; j < c.tail.length; j++) {
      const tt = c.tail[j];
      const alpha = ((j + 1) / c.tail.length) * 0.8;
      const s = ((j + 1) / c.tail.length) * 4;
      ctx.beginPath();
      ctx.arc(tt.x, tt.y, s, 0, Math.PI * 2);
      if (autoColor) {
        ctx.fillStyle = hslToStr((hueOffset + 200) % 360, 90, 60, alpha);
      } else {
        ctx.fillStyle = document.getElementById('colorParticles').value;
        ctx.globalAlpha = alpha;
      }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawMosaic() {
  const cols = 24;
  const rows = Math.floor(cols * (H / W));
  const cw = W / cols;
  const ch = H / rows;
  const autoColor = document.getElementById('autoColor').checked;
  const energy = beatIntensity + getAvg(0.05, 0.3) * 0.5;

  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const idx = (j * cols + i) % bufferLength;
      const v = getVal(idx) * 0.4;
      const pulse = v * energy * fx();
      const px = i * cw;
      const py = j * ch;
      const s = Math.max(cw * (0.4 + pulse), 1);
      ctx.fillStyle = autoColor
        ? hslToStr((hueOffset + i * 12 + j * 8) % 360, 80, 35 + v * 40)
        : document.getElementById('colorBars').value;
      ctx.globalAlpha = 0.55 + v * 0.45;
      ctx.fillRect(px + (cw - s) / 2, py + (ch - s) / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWater() {
  const bass = getAvg(0, 0.1);
  const mid = getAvg(0.1, 0.5);
  const now = performance.now();
  const auto = document.getElementById('autoColor').checked;
  const yBase = cy + 30 + Math.sin(now / 1200) * 15 + bass * 40 * fx();
  const step = IS_MOBILE ? 6 : 3;

  ctx.beginPath();
  ctx.moveTo(0, yBase);
  for (let x = 0; x <= W; x += step) {
    const f1 = Math.sin(x * 0.012 + now / 500 + mid * 5);
    const f2 = Math.sin(x * 0.025 - now / 700 + bass * 3) * 0.6;
    const f3 = Math.sin(x * 0.05 + now / 300 + mid * 7) * 0.3;
    const f4 = Math.sin(x * 0.08 - now / 200 + bass * 6) * 0.15;
    const amp = (15 + mid * 35 * fx()) * (1 + beatIntensity * 1.5);
    const y = yBase + (f1 + f2 + f3 + f4) * amp;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, yBase - 30, 0, Math.min(yBase + 220, H));
  if (auto) {
    const h = (hueOffset + 200) % 360;
    grad.addColorStop(0, hslToStr(h, 80, 40, 0.25));
    grad.addColorStop(0.35, hslToStr(h + 10, 75, 28, 0.35));
    grad.addColorStop(1, hslToStr(h - 10, 85, 14, 0.55));
  } else {
    const c = document.getElementById('colorRings').value;
    grad.addColorStop(0, hexToRgba(c, 0.25));
    grad.addColorStop(0.35, hexToRgba(c, 0.35));
    grad.addColorStop(1, hexToRgba(c, 0.55));
  }
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, yBase);
  for (let x = 0; x <= W; x += step) {
    const f1 = Math.sin(x * 0.012 + now / 500 + mid * 5);
    const f2 = Math.sin(x * 0.025 - now / 700 + bass * 3) * 0.6;
    const f3 = Math.sin(x * 0.05 + now / 300 + mid * 7) * 0.3;
    const f4 = Math.sin(x * 0.08 - now / 200 + bass * 6) * 0.15;
    const amp = (15 + mid * 35 * fx()) * (1 + beatIntensity * 1.5);
    const y = yBase + (f1 + f2 + f3 + f4) * amp;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = auto
    ? hslToStr((hueOffset + 200) % 360, 90, 65, 0.18 + beatIntensity * 0.25)
    : '#ffffff44';
  ctx.lineWidth = 1.5 + beatIntensity * 2;
  ctx.stroke();

  if (beatIntensity > 0.12) {
    for (let i = 0; i < 8; i++) {
      const rx = Math.random() * W;
      const ry = yBase + Math.random() * 40 + 10;
      ctx.beginPath();
      ctx.arc(rx, ry, 1 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.3})`;
      ctx.fill();
    }
  }

  const causticCount = IS_MOBILE ? 18 : 36;
  ctx.lineWidth = 1;
  for (let i = 0; i < causticCount; i++) {
    const cx2 = (i / causticCount) * W;
    const cy2 = yBase + 20 + Math.sin(now / 600 + i * 1.2) * 30 + bass * 15;
    const len = 30 + Math.sin(now / 400 + i * 2.3) * 20 + mid * 30 * fx();
    const angle = Math.sin(now / 800 + i) * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx2 - len / 2, cy2);
    ctx.quadraticCurveTo(cx2, cy2 - 12 + Math.sin(now / 300 + i) * 10 * mid, cx2 + len / 2, cy2);
    ctx.strokeStyle = auto
      ? hslToStr((hueOffset + 195 + i * 2) % 360, 70, 65, 0.08 + mid * 0.12)
      : 'rgba(255,255,255,0.07)';
    ctx.stroke();
  }
}

function spawnBubble() {
  const energy = getAvg(0.1, 0.5);
  bubbles.push({
    x: Math.random() * W,
    y: H + 10 + Math.random() * 20,
    r: (2 + Math.random() * 9 + energy * 5 * fx()) * (0.6 + Math.random() * 0.4),
    vy: -(0.4 + Math.random() * 0.8 + energy * 0.5) * fx(),
    wobPhase: Math.random() * Math.PI * 2,
    wobSpeed: 0.03 + Math.random() * 0.04
  });
}

function updateBubbles() {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    b.wobPhase += b.wobSpeed;
    b.x += Math.sin(b.wobPhase) * 0.8;
    if (b.y < -30 || b.x < -30 || b.x > W + 30) bubbles.splice(i, 1);
  }
}

function drawBubbles() {
  const maxB = IS_MOBILE ? 45 : 90;
  if (bubbles.length < maxB && Math.random() < 0.18) spawnBubble();
  for (const b of bubbles) {
    const bScale = 1 + beatIntensity * 0.25;
    const r = b.r * bScale;
    const g = ctx.createRadialGradient(b.x - r * 0.32, b.y - r * 0.32, r * 0.05, b.x, b.y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.04)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.01)');
    g.addColorStop(0.75, 'rgba(255,255,255,0.06)');
    g.addColorStop(1, 'rgba(255,255,255,0.22)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.08 + beatIntensity * 0.12})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x - r * 0.3, b.y - r * 0.32, r * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.48)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x + r * 0.25, b.y - r * 0.15, r * 0.08, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
  }
}

function spawnShards(count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (1.5 + Math.random() * 3.5) * fx();
    shards.push({
      x: cx,
      y: cy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.25,
      w: 4 + Math.random() * 14,
      h: 5 + Math.random() * 18,
      life: 1,
      decay: 0.008 + Math.random() * 0.018,
      hue: (hueOffset + Math.random() * 40) % 360
    });
  }
}

function updateShards() {
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.025;
    s.vx *= 0.995;
    s.rot += s.vr;
    s.life -= s.decay;
    if (s.life <= 0) shards.splice(i, 1);
  }
}

function drawGlass() {
  const energy = getAvg(0, 0.25);
  const mid = getAvg(0.15, 0.5);
  const now = performance.now();
  if (energy > 0.28 * fx() && Math.random() < 0.35) {
    spawnShards(6 + Math.floor(energy * 12));
  }

  for (const s of shards) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = s.life;
    ctx.beginPath();
    ctx.moveTo(0, -s.h / 2);
    ctx.lineTo(s.w * 0.8, s.h * 0.45);
    ctx.lineTo(-s.w * 0.7, s.h * 0.6);
    ctx.closePath();
    ctx.fillStyle = `rgba(255,255,255,0.10)`;
    ctx.fill();
    ctx.strokeStyle = `rgba(200,230,255,0.38)`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s.w * 0.1, -s.h * 0.2, s.w * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,0.55)`;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  const gR = 55 + beatIntensity * 30 + mid * 15 * fx();
  const cxg = cx + Math.sin(now / 700) * beatIntensity * 8;
  const cyg = cy + Math.cos(now / 900) * beatIntensity * 6;
  const gGrad = ctx.createRadialGradient(cxg - gR * 0.32, cyg - gR * 0.38, gR * 0.05, cxg, cyg, gR);
  gGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
  gGrad.addColorStop(0.35, 'rgba(255,255,255,0.025)');
  gGrad.addColorStop(0.75, 'rgba(255,255,255,0.03)');
  gGrad.addColorStop(1, 'rgba(255,255,255,0.14)');
  ctx.beginPath();
  ctx.arc(cxg, cyg, gR, 0, Math.PI * 2);
  ctx.fillStyle = gGrad;
  ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${0.12 + beatIntensity * 0.3})`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cxg - gR * 0.32, cyg - gR * 0.38, gR * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cxg + gR * 0.3, cyg + gR * 0.15, gR * 0.07, gR * 0.04, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fill();

  const caustics = 5 + Math.floor(mid * 6 * fx());
  ctx.lineWidth = 0.8;
  for (let i = 0; i < caustics; i++) {
    const angle = (i / caustics) * Math.PI * 2 + now / 2000;
    const d = gR * 1.3 + Math.sin(now / 500 + i * 2) * 15;
    const cx2 = cxg + Math.cos(angle) * d;
    const cy2 = cyg + Math.sin(angle) * d;
    const len = 15 + Math.sin(now / 400 + i * 1.7) * 10 + mid * 20 * fx();
    ctx.beginPath();
    ctx.arc(cx2, cy2, len, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.04 + mid * 0.08})`;
    ctx.stroke();
  }
}

function drawGlassOverlay() {
  if (!GLASS_STYLE) return;
  const now = performance.now();
  const auto = document.getElementById('autoColor').checked;

  ctx.fillStyle = auto ? hslToStr(hueOffset % 360, 15, 92, 0.05) : 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, 0, W, H);

  if (beatIntensity > 0.08) {
    ctx.fillStyle = auto ? hslToStr((hueOffset + 200) % 360, 20, 95, beatIntensity * 0.05) : 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const streaks = IS_MOBILE ? 9 : 16;
  for (let i = 0; i < streaks; i++) {
    const speed = 0.5 + (i % 3) * 0.25;
    const y = ((i / streaks) * H * 1.4 + now / 45 * speed) % (H * 1.4);
    const w = 6 + Math.sin(now / 1500 + i * 1.3) * 5;
    const grad = ctx.createLinearGradient(0, y - w, 0, y + w);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, `rgba(255,255,255,${0.03 + beatIntensity * 0.05})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y - w, W, w * 2);
  }

  if (beatIntensity > 0.12) {
    const gx = cx + Math.cos(now / 500) * W * 0.22;
    const gr = ctx.createRadialGradient(gx, cy, 0, gx, cy, 170 + beatIntensity * 230);
    gr.addColorStop(0, `rgba(255,255,255,${beatIntensity * 0.16})`);
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(gx - 300, cy - 300, 600, 600);
  }
  ctx.restore();

  const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.32, cx, cy, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function liquidBlob(cx2, cy2, R, seed, alphaMul) {
  const bass = getAvg(0, 0.1);
  const mid = getAvg(0.15, 0.5);
  const now = performance.now() + seed * 1000;
  const n = 56;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const n1 = Math.sin(a * 4 + now / 650 + mid * 4) * 0.11;
    const n2 = Math.sin(a * 7 - now / 850 + bass * 3 + seed) * 0.06;
    const n3 = Math.sin(a * 2 + now / 500 + seed * 2) * 0.06;
    const n4 = Math.sin(a * 11 + now / 1100 + mid * 6) * 0.025;
    const r = R * (1 + n1 + n2 + n3 + n4) * (1 + beatIntensity * 0.22);
    const x = cx2 + Math.cos(a) * r;
    const y = cy2 + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  return { x: cx2, y: cy2, r: R, done: true };
}

function drawLiquidGlass() {
  if (!effects.liquid) return;
  const bass = getAvg(0, 0.1);
  const mid = getAvg(0.15, 0.5);
  const now = performance.now();

  const R = Math.min(W, H) * (0.16 + bass * 0.06 * fx()) + beatIntensity * 14;

  ctx.save();

  if (beatIntensity > 0.1) {
    ctx.shadowColor = 'rgba(180,220,255,0.55)';
    ctx.shadowBlur = 30 + beatIntensity * 40;
  }

  const blob = liquidBlob(cx, cy, R, 0, 1);

  ctx.fillStyle = 'rgba(200,230,255,0.045)';
  ctx.fill();
  ctx.strokeStyle = `rgba(220,240,255,${0.45 + beatIntensity * 0.3})`;
  ctx.lineWidth = 1.6 + beatIntensity * 1.5;
  ctx.stroke();

  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fill();

  const n = 56;
  ctx.beginPath();
  const sw = Math.sin(now / 900) * R * 0.4;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rInner = R * 0.72 + Math.sin(a * 3 + now / 700 + mid * 5) * R * 0.12 + sw * Math.sin(a * 2 + now / 900);
    const x = cx + Math.cos(a) * Math.max(rInner, 2);
    const y = cy + Math.sin(a) * Math.max(rInner, 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  const ig = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.3, R * 0.05, cx, cy, R * 0.98);
  ig.addColorStop(0, `rgba(255,255,255,${0.10 + beatIntensity * 0.06})`);
  ig.addColorStop(0.45, 'rgba(255,255,255,0.015)');
  ig.addColorStop(0.8, 'rgba(170,220,255,0.03)');
  ig.addColorStop(1, 'rgba(255,255,255,0.08)');
  ctx.fillStyle = ig;
  ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${0.12 + beatIntensity * 0.15})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  const hg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.36, 1, cx - R * 0.3, cy - R * 0.36, R * 0.5);
  hg.addColorStop(0, `rgba(255,255,255,${0.45 + beatIntensity * 0.2})`);
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.ellipse(cx - R * 0.3, cy - R * 0.36, R * 0.34, R * 0.2, -0.5 + beatIntensity * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = hg;
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(cx + R * 0.28, cy + R * 0.18, R * 0.09, R * 0.05, 0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();

  const swirls = 3;
  ctx.lineWidth = 1.2;
  for (let i = 0; i < swirls; i++) {
    const sa = now / 1400 + i * 2.1;
    const sr = R * (0.25 + i * 0.2);
    ctx.beginPath();
    for (let k = 0; k <= 30; k++) {
      const t = k / 30;
      const ang = sa + t * Math.PI * 1.6;
      const rad = sr + Math.sin(t * Math.PI + mid * 3) * R * 0.12 * (i + 1) * 0.4;
      const x = cx + Math.cos(ang) * rad;
      const y = cy + Math.sin(ang) * Math.min(rad, R * 0.9) * 0.7;
      if (k === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(220,245,255,${0.06 + mid * 0.05})`;
    ctx.stroke();
  }

  const dropletCount = 5 + Math.floor(bass * 4 * fx());
  for (let i = 0; i < dropletCount; i++) {
    const a = now / 1700 + (i / dropletCount) * Math.PI * 2;
    const d = R * (1.35 + beatIntensity * 0.25) + Math.sin(now / 500 + i * 2.4) * 12;
    const dr = 4 + Math.random() * 8 * mid + i % 3 * 3;
    const px = cx + Math.cos(a) * d;
    const py = cy + Math.sin(a) * d;
    ctx.beginPath();
    ctx.arc(px, py, dr, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(220,240,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = `rgba(230,245,255,${0.3 + beatIntensity * 0.2})`;
    ctx.lineWidth = 1 + beatIntensity;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px - dr * 0.3, py - dr * 0.32, dr * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.4 + beatIntensity * 0.2})`;
    ctx.fill();
  }

  ctx.restore();
}

function drawRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.radius += 4;
    r.life -= 0.015;
    if (r.life <= 0) {
      ripples.splice(i, 1);
      continue;
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r.radius, 0, Math.PI * 2);
    ctx.strokeStyle = hslToStr(r.hue, 80, 60, r.life * 0.5);
    ctx.lineWidth = 2 + beatIntensity * 3;
    ctx.stroke();
  }
}

function drawPhoto() {
  if (!photos.length) return;
  const baseSize = parseFloat(document.getElementById('photoSize').value) || 100;
  const bounceForce = parseFloat(document.getElementById('bounceForce').value);
  const now = performance.now();

  photos.forEach((ph, index) => {
    const bounce = beatIntensity * bounceForce;
    const size = baseSize * ph.sizeMult + bounce * 1.5;
    const orbitX = Math.cos(ph.orbitAngle) * ph.orbitRadius;
    const orbitY = Math.sin(ph.orbitAngle) * ph.orbitRadius;
    ph.orbitAngle += ph.orbitSpeed;

    const wobbleX = Math.sin(now / 200 + ph.phaseX) * beatIntensity * 12;
    const wobbleY = Math.cos(now / 300 + ph.phaseY) * beatIntensity * 10;
    const x = cx + orbitX + wobbleX;
    const y = cy + orbitY + wobbleY - bounce * 0.4;
    const scale = 1 + beatIntensity * 0.15 * ph.sizeMult;
    const s = size * scale;

    ctx.save();
    ctx.translate(x, y);

    if (beatIntensity > 0.12) {
      ctx.shadowColor = hslToStr((hueOffset + index * 40) % 360, 90, 60, 0.6);
      ctx.shadowBlur = 15 + beatIntensity * 25;
    }

    const imgW = ph.img.naturalWidth || s;
    const imgH = ph.img.naturalHeight || s;
    const aspect = imgW / imgH;
    let drawW, drawH;
    if (aspect > 1) {
      drawH = s;
      drawW = s * aspect;
    } else {
      drawW = s;
      drawH = s / aspect;
    }

    ctx.beginPath();
    ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(ph.img, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, s / 2 + 3, 0, Math.PI * 2);
    ctx.strokeStyle = hslToStr((hueOffset + index * 40) % 360, 80, 60, 0.4 + beatIntensity * 0.5);
    ctx.lineWidth = 2;
    ctx.stroke();

    if (GLASS_STYLE) {
      ctx.beginPath();
      ctx.arc(x - s * 0.28, y - s * 0.32, s * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + s * 0.25, y - s * 0.15, s * 0.07, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, s / 2 * 0.8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.1 + beatIntensity * 0.2})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  });
}

function downAt(x, y) {
  if (photoDragIndex !== null) return;
  const baseSize = parseFloat(document.getElementById('photoSize').value) || 100;
  for (let i = photos.length - 1; i >= 0; i--) {
    const ph = photos[i];
    const size = baseSize * ph.sizeMult;
    const px = cx + Math.cos(ph.orbitAngle) * ph.orbitRadius;
    const py = cy + Math.sin(ph.orbitAngle) * ph.orbitRadius;
    const dist = Math.hypot(x - px, y - py);
    if (dist < size / 2 + 10) {
      photoDragIndex = i;
      break;
    }
  }
}

function moveAt(x, y) {
  if (photoDragIndex === null) return;
  const ph = photos[photoDragIndex];
  const dx = x - cx;
  const dy = y - cy;
  ph.orbitRadius = Math.hypot(dx, dy);
  ph.orbitAngle = Math.atan2(dy, dx);
}

function upAt() {
  photoDragIndex = null;
}

canvas.addEventListener('mousedown', e => downAt(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => moveAt(e.clientX, e.clientY));
canvas.addEventListener('mouseup', upAt);
canvas.addEventListener('mouseleave', upAt);
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    downAt(t.clientX, t.clientY);
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (photoDragIndex !== null && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    moveAt(t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchend', upAt);
canvas.addEventListener('touchcancel', upAt);

function autoColorCycle() {
  if (document.getElementById('autoColor').checked) {
    hueOffset += 0.3;
  }
}

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function animate() {
  requestAnimationFrame(animate);

  const bg = document.getElementById('colorBg').value;
  const trail = parseInt(document.getElementById('trailLength').value) / 100;
  if (trail > 0.01) {
    ctx.fillStyle = hexToRgba(bg, trail);
  } else {
    ctx.fillStyle = bg;
  }
  ctx.fillRect(0, 0, W, H);

  if (analyser && isPlaying) {
    analyser.getByteFrequencyData(dataArray);
  }

  const isBeat = detectBeat();

  if (isBeat && effects.particles) {
    spawnParticles(Math.floor((8 + beatIntensity * 20) * fx()));
  }
  if (isBeat && effects.ripple) {
    ripples.push({
      radius: 20,
      life: 1,
      hue: (hueOffset + Math.random() * 60) % 360
    });
  }
  if (isBeat && effects.tunnel) {
    for (let i = 0; i < 4; i++) {
      ripples.push({
        radius: 5,
        life: 1,
        hue: (hueOffset + Math.random() * 60) % 360
      });
    }
  }
  if (isBeat && GLASS_STYLE) {
    spawnShards(3 + Math.floor(beatIntensity * 8));
  }

  if (effects.wave) drawWave();
  if (effects.bars) drawBars();
  if (effects.circle) drawCircle();
  if (effects.tunnel) drawTunnel();
  if (effects.grid) drawGrid();
  if (effects.spiral) drawSpiral();

  updateParticles();
  if (effects.particles) drawParticles();

  updateFire();
  if (effects.fire) drawFire();

  updateComets();
  if (effects.comets) drawComets();

  updateBubbles();
  if (effects.bubbles) drawBubbles();

  updateShards();
  if (effects.glass || GLASS_STYLE) drawGlass();

  drawLiquidGlass();

  if (effects.water) drawWater();
  if (effects.stars) drawStars();
  if (effects.mosaic) drawMosaic();

  if (effects.ripple) drawRipples();
  if (effects.photo) drawPhoto();
  drawGlassOverlay();

  autoColorCycle();
}

animate();

document.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });
</script>
